apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent
  namespace: media
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: qbittorrent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qbittorrent
    spec:
      containers:
        - name: qbittorrent
          image: ghcr.io/hotio/qbittorrent:latest
          env:
            - name: UMASK
              value: "002"
            - name: VPN_ENABLED
              value: "true"
            - name: VPN_CONF
              value: wg0
            - name: VPN_PROVIDER
              value: "proton"
            - name: VPN_AUTO_PORT_FORWARD
              value: "true"
            - name: VPN_HEALTHCHECK_ENABLED
              value: "false"
            - name: WEBUI_PORTS
              value: 8080/tcp
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /config
            - name: data
              mountPath: /data
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: qbittorrent-config
        - name: data
          persistentVolumeClaim:
            claimName: data
